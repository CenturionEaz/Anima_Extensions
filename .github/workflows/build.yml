name: Build Extension Indexes & Readme

on:
  push:
    branches:
      - main
    paths:
      - "javascript/**"
      - "repo_config.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (for validation)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Extensions
        run: |
          python scripts/test_source.py

      - name: Build Repositories and README
        run: |
          python scripts/build_repo.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json anime_index.json novel_index.json repo.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate extension indices and documentation [skip ci]"
            git push
          fi
